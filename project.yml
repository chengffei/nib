name: Nib
options:
  bundleIdPrefix: com.chengffei
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
targets:
  Nib:
    type: application
    platform: macOS
    sources:
      - path: Nib
        excludes: [Editor, Resources]
      - path: Nib/Editor
        type: folder
        buildPhase: resources
      - path: Nib/Resources/docs
        type: folder
        buildPhase: resources
    entitlements:
      path: Nib/Nib.entitlements
      properties:
        # Not sandboxed: not distributed via the App Store, and images next to the document must be readable directly
        com.apple.security.app-sandbox: false
    info:
      path: Nib/Info.plist
      properties:
        CFBundleName: Nib
        CFBundleDisplayName: Nib
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "8"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Felix"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengffei.nib
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  Nib:
    build:
      targets:
        Nib: all
    run:
      config: Debug
