name: Nib
options:
  bundleIdPrefix: com.chengffei
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    branch: main
targets:
  Nib:
    type: application
    platform: macOS
    sources: [Nib]
    dependencies:
      - package: Markdown
        product: Markdown
    entitlements:
      path: Nib/Nib.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Nib/Info.plist
      properties:
        CFBundleName: Nib
        CFBundleDisplayName: Nib
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Felix"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengffei.nib
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  NibTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NibTests]
    dependencies:
      - target: Nib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengffei.nib.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  Nib:
    build:
      targets:
        Nib: all
        NibTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [NibTests]
