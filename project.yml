name: Nib
options:
  bundleIdPrefix: com.chengffei
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
targets:
  Nib:
    type: application
    platform: macOS
    sources:
      - path: Nib
        excludes: [Editor]
      - path: Nib/Editor
        type: folder
        buildPhase: resources
    entitlements:
      path: Nib/Nib.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # 沙盒里的 WKWebView 没有这一项就起不来渲染进程；页面本身用 CSP 禁掉一切网络请求
        com.apple.security.network.client: true
    info:
      path: Nib/Info.plist
      properties:
        CFBundleName: Nib
        CFBundleDisplayName: Nib
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Felix"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengffei.nib
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  Nib:
    build:
      targets:
        Nib: all
    run:
      config: Debug
